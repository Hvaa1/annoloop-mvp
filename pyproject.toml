[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "annoloop-mvp"
version = "0.1.0"
description = "Local annotation adaptation backend with versioned labels"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "scipy>=1.10,<2", "PyYAML>=6,<7"]

[project.optional-dependencies]
ui = ["streamlit>=1.65,<2", "plotly>=5.24,<7"]
training = ["easydict>=1.13,<2", "tensorboardX>=2.6,<3", "numba>=0.60,<0.69", "scikit-image>=0.22,<1", "pyquaternion>=0.9.9,<1", "nuscenes-devkit==1.1.11"]
cvat = ["cvat-sdk>=2.50,<3"]
pcd = ["pypcd4>=1.1,<2"]

[project.scripts]
annoloop = "annoloop.cli:main"
annoloop-connect-model = "annoloop.connect_model:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
annoloop = ["catalog/*.json", "catalog/*.yaml", "catalog/*.txt"]
